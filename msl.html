<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard MSL — Bimbo Tools</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c0392b" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html">&larr;</a>
    <h1 id="titulo">Dashboard MSL</h1>
    <span></span>
  </header>

  <main class="wide">
    <div class="summary-grid" id="resumenGeneral"></div>

    <div class="pill-select" id="drillTabs">
      <a class="pill active" data-nivel="ibp">Por IBP</a>
      <a class="pill" data-nivel="ruta">Por Ruta</a>
      <a class="pill" data-nivel="cliente">Por Cliente</a>
    </div>

    <div id="contenido"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const params = new URLSearchParams(location.search);
    const mslId = params.get("u") || "msl-1";
    let nivel = "ibp";
    const { icono, tonoPct, etiquetaSemaforo, iniciales, statCard } = BimboUI;

    function renderResumenGeneral(ibps) {
      const cont = document.getElementById("resumenGeneral");
      if (!ibps.length) {
        cont.innerHTML = "";
        return;
      }

      let hoyTotal = 0, hoyVisitados = 0, semTotal = 0, semVisitados = 0, sumaFrescura = 0, conFrescura = 0;
      ibps.forEach((ibp) => {
        const hoy = BimboData.getCumplimientoIbp(ibp.id);
        const sem = BimboData.getProgresoSemanalIbp(ibp.id);
        hoyTotal += hoy.total;
        hoyVisitados += hoy.visitadas;
        semTotal += sem.total;
        semVisitados += sem.visitados;
        const f = BimboData.getFrescuraIbp(ibp.id);
        if (f != null) { sumaFrescura += f; conFrescura++; }
      });

      const pctHoy = hoyTotal ? Math.round((hoyVisitados / hoyTotal) * 100) : 0;
      const pctSem = semTotal ? Math.round((semVisitados / semTotal) * 100) : 0;
      const frescuraProm = conFrescura ? sumaFrescura / conFrescura : null;
      const semFrescura = BimboData.semaforoFrescura(frescuraProm);
      const pctFrescura = frescuraProm != null ? Math.round(frescuraProm * 100) + "%" : "—";

      const tonoHoy = tonoPct(pctHoy, hoyTotal);
      const tonoSem = tonoPct(pctSem, semTotal);
      const ibpsAlDia = ibps.filter((ibp) => {
        const h = BimboData.getCumplimientoIbp(ibp.id);
        return h.total > 0 && h.visitadas === h.total;
      }).length;

      cont.innerHTML = [
        statCard({
          titulo: "IBPs a cargo",
          icono: "users",
          tono: "accent",
          valor: ibps.length,
          sub: `<span class="chip tono-verde">${ibpsAlDia} al día</span> ruta de hoy completa`,
        }),
        statCard({
          titulo: "Cumplimiento hoy",
          icono: "pin",
          tono: tonoHoy,
          valor: `${pctHoy}%`,
          sub: `${hoyVisitados} de ${hoyTotal} clientes visitados`,
          meter: pctHoy,
        }),
        statCard({
          titulo: "Progreso semanal",
          icono: "calendar",
          tono: tonoSem,
          valor: `${pctSem}%`,
          sub: `${semVisitados} de ${semTotal} visitas de la semana`,
          meter: pctSem,
        }),
        statCard({
          titulo: "Frescura promedio",
          icono: "leaf",
          tono: semFrescura,
          valor: pctFrescura,
          sub: `<span class="chip tono-${semFrescura}">${etiquetaSemaforo(semFrescura)}</span> ${conFrescura} de ${ibps.length} IBPs con dato`,
          meter: frescuraProm != null ? Math.round(frescuraProm * 100) : null,
        }),
      ].join("");
    }

    function renderSemanaChart(porDia) {
      return `
        <div class="semana-chart">
          ${porDia
            .map((d) => {
              const pct = d.total ? Math.round((d.visitados / d.total) * 100) : 0;
              const estado = d.total === 0 ? "vacio" : d.visitados === d.total ? "completo" : d.visitados > 0 ? "parcial" : "vacio";
              const alturaPct = d.total === 0 ? 6 : Math.max(pct, 6);
              return `
                <div class="semana-col ${d.esHoy ? "hoy" : ""}">
                  <span class="semana-frac">${d.visitados}/${d.total}</span>
                  <div class="semana-track">
                    <div class="semana-fill ${estado}" style="height:${alturaPct}%"></div>
                  </div>
                  <span class="semana-dia">${d.dia.slice(0, 3)}</span>
                </div>
              `;
            })
            .join("")}
        </div>
      `;
    }

    async function render() {
      await BimboData.init();
      const msl = BimboData.getUsuario(mslId);
      document.getElementById("titulo").textContent = msl ? msl.nombre : "Dashboard MSL";

      const ibps = BimboData.getIbpsDeMSL(mslId);
      const cont = document.getElementById("contenido");

      renderResumenGeneral(ibps);

      if (nivel === "ibp") {
        const tarjetas = ibps
          .map((ibp) => {
            const { total, visitadas, pendientes } = BimboData.getCumplimientoIbp(ibp.id);
            const semanal = BimboData.getProgresoSemanalIbp(ibp.id);
            const porDia = BimboData.getProgresoSemanalPorDia(ibp.id);
            const frescura = BimboData.getFrescuraIbp(ibp.id);
            const sem = BimboData.semaforoFrescura(frescura);
            const pct = frescura != null ? Math.round(frescura * 100) + "%" : "—";
            const pctHoy = total ? Math.round((visitadas / total) * 100) : 0;
            const pctSemanal = semanal.total ? Math.round((semanal.visitados / semanal.total) * 100) : 0;
            const ruta = BimboData.getRutaDeIbp(ibp.id);
            return `
              <a class="card ibp-card" href="ibp.html?u=${ibp.id}&rol=MSL&msl=${mslId}">
                <div class="ibp-head">
                  <span class="avatar">${iniciales(ibp.nombre)}</span>
                  <div class="nombre">
                    <strong>${ibp.nombre}</strong>
                    <span>${ruta ? ruta.nombre : "Sin ruta asignada"}</span>
                  </div>
                  <span class="chip tono-${sem}">Frescura ${pct}</span>
                  <span class="chevron">${icono("chevron", 18)}</span>
                </div>

                <div class="kpi-strip">
                  <div><div class="num">${total}</div><div class="label">clientes hoy</div></div>
                  <div class="tono-verde"><div class="num">${visitadas}</div><div class="label">visitados</div></div>
                  <div class="${pendientes ? "tono-amarillo" : ""}"><div class="num">${pendientes}</div><div class="label">pendientes</div></div>
                </div>

                <div class="seccion-label"><span>Hoy</span><span class="valor">${pctHoy}%</span></div>
                <div class="stat-meter tono-${tonoPct(pctHoy, total)}"><span style="width:${pctHoy}%"></span></div>

                <div class="seccion-label"><span>Progreso semanal</span><span class="valor">${semanal.visitados}/${semanal.total} · ${pctSemanal}%</span></div>
                ${renderSemanaChart(porDia)}
              </a>
            `;
          })
          .join("");
        cont.innerHTML = tarjetas
          ? `<div class="ibp-grid">${tarjetas}</div>`
          : `<div class="empty-state">No tienes IBPs asignados.</div>`;
      }

      if (nivel === "ruta") {
        cont.innerHTML = ibps
          .map((ibp) => {
            const ruta = BimboData.getRutaDeIbp(ibp.id);
            if (!ruta) return "";
            const frescura = BimboData.getFrescuraRuta(ruta.id);
            const sem = BimboData.semaforoFrescura(frescura);
            const pct = frescura != null ? Math.round(frescura * 100) + "%" : "—";
            const clientes = BimboData.getClientesDeRuta(ruta.id);
            const semanal = BimboData.getProgresoSemanalRuta(ruta.id);
            const pctSemanal = semanal.total ? Math.round((semanal.visitados / semanal.total) * 100) : 0;
            return `
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong>${ruta.nombre}</strong>
                  <span class="chip tono-${sem}">Frescura promedio ${pct}</span>
                </div>
                <p style="font-size:13px; color:var(--gray); margin:6px 0 0;">
                  IBP: ${ibp.nombre} · ${clientes.length} clientes en la ruta
                </p>
                <div class="seccion-label"><span>Progreso semanal</span><span class="valor">${semanal.visitados}/${semanal.total} · ${pctSemanal}%</span></div>
                <div class="stat-meter tono-${tonoPct(pctSemanal, semanal.total)}"><span style="width:${pctSemanal}%"></span></div>
              </div>
            `;
          })
          .join("");
      }

      if (nivel === "cliente") {
        const filas = ibps
          .flatMap((ibp) => {
            const ruta = BimboData.getRutaDeIbp(ibp.id);
            if (!ruta) return [];
            return BimboData.getClientesDeRuta(ruta.id).map((c) => ({ ...c, ibpNombre: ibp.nombre, rutaNombre: ruta.nombre }));
          })
          .sort((a, b) => (a.frescura || 0) - (b.frescura || 0));

        cont.innerHTML = `
          <div class="card">
            <table class="data-table">
              <thead>
                <tr><th>Cliente</th><th>Ruta / IBP</th><th>Frecuencia</th><th>Frescura</th></tr>
              </thead>
              <tbody>
                ${filas
                  .map((c) => {
                    const sem = BimboData.semaforoFrescura(c.frescura);
                    const pct = c.frescura != null ? Math.round(c.frescura * 100) + "%" : "—";
                    return `
                      <tr>
                        <td>${c.nombre}</td>
                        <td>${c.rutaNombre}<br><span style="color:var(--gray)">${c.ibpNombre}</span></td>
                        <td>${c.frecuencia}</td>
                        <td><span class="semaforo ${sem}"></span>${pct}</td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }
    }

    document.getElementById("drillTabs").addEventListener("click", (e) => {
      const el = e.target.closest(".pill");
      if (!el) return;
      document.querySelectorAll("#drillTabs .pill").forEach((p) => p.classList.remove("active"));
      el.classList.add("active");
      nivel = el.dataset.nivel;
      render();
    });

    render();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
